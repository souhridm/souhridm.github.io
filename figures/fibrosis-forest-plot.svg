<rect x="375.0" y="257.9" width="8.3" height="8.3" fill="#1d4ed8"/>
<text x="98" y="290.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 11</text>
<line x1="270.9" y1="286.0" x2="528.0" y2="286.0" stroke="#1d4ed8" stroke-width="2"/>
