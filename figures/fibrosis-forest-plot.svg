<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Forest plot of one candidate gene across 13 public fibrosis cohorts</title>
<desc id="d">Every cohort shows higher expression in fibrotic tissue than in controls. Effect sizes range from about 1.1 to 2.9, and the pooled estimate is about 1.9.</desc>
<rect width="640" height="416" fill="#ffffff"/>
<text x="110" y="18" font-size="13" font-weight="bold" fill="#18181b">One candidate gene, 13 public cohorts</text>
<line x1="110.0" y1="28" x2="110.0" y2="374" stroke="#52525b" stroke-dasharray="3 3"/>
<text x="98" y="50.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 1</text>
<line x1="145.4" y1="46.0" x2="299.2" y2="46.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="217.6" y="42.3" width="7.4" height="7.4" fill="#1d4ed8"/>
<text x="98" y="74.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 2</text>
<line x1="116.1" y1="70.0" x2="382.2" y2="70.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="246.0" y="66.3" width="7.4" height="7.4" fill="#1d4ed8"/>
<text x="98" y="98.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 3</text>
<line x1="152.5" y1="94.0" x2="361.0" y2="94.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="253.0" y="90.3" width="7.4" height="7.4" fill="#1d4ed8"/>
<text x="98" y="122.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 4</text>
<line x1="181.9" y1="118.0" x2="341.7" y2="118.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="257.6" y="113.8" width="8.3" height="8.3" fill="#1d4ed8"/>
<text x="98" y="146.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 5</text>
<line x1="123.2" y1="142.0" x2="408.5" y2="142.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="261.7" y="137.8" width="8.3" height="8.3" fill="#1d4ed8"/>
<text x="98" y="170.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 6</text>
