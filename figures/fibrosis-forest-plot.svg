<line x1="246.6" y1="190.0" x2="354.9" y2="190.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="296.7" y="185.4" width="9.2" height="9.2" fill="#1d4ed8"/>
<text x="98" y="218.0" font-size="12" text-anchor="end" fill="#52525b">Cohort 8</text>
<line x1="281.0" y1="214.0" x2="334.7" y2="214.0" stroke="#1d4ed8" stroke-width="2"/>
<rect x="301.5" y="207.2" width="13.7" height="13.7" fill="#1d4ed8"/>
