<line x1="10" y1="352" x2="616" y2="352" stroke="#d4d6db"/>
<text x="98" y="370" font-size="12" font-weight="bold" text-anchor="end" fill="#18181b">Pooled</text>
<polygon points="276.0,366 299.2,359 324.5,366 299.2,373" fill="#18181b"/>
<line x1="110" y1="384" x2="616" y2="384" stroke="#52525b"/>
<line x1="110.0" y1="384" x2="110.0" y2="388" stroke="#52525b"/>
<text x="110.0" y="401" font-size="11" text-anchor="middle" fill="#52525b">0</text>
<line x1="211.2" y1="384" x2="211.2" y2="388" stroke="#52525b"/>
<text x="211.2" y="401" font-size="11" text-anchor="middle" fill="#52525b">1</text>
<line x1="312.4" y1="384" x2="312.4" y2="388" stroke="#52525b"/>
<text x="312.4" y="401" font-size="11" text-anchor="middle" fill="#52525b">2</text>
<line x1="413.6" y1="384" x2="413.6" y2="388" stroke="#52525b"/>
<text x="413.6" y="401" font-size="11" text-anchor="middle" fill="#52525b">3</text>
<line x1="514.8" y1="384" x2="514.8" y2="388" stroke="#52525b"/>
<text x="514.8" y="401" font-size="11" text-anchor="middle" fill="#52525b">4</text>
<line x1="616.0" y1="384" x2="616.0" y2="388" stroke="#52525b"/>
<text x="616.0" y="401" font-size="11" text-anchor="middle" fill="#52525b">5</text>
<text x="363.0" y="416" font-size="12" text-anchor="middle" fill="#18181b">Effect size (Hedges' g), fibrosis minus control</text>
