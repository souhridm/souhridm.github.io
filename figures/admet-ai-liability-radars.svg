<line x1="125.0" y1="150.0" x2="173.5" y2="122.0" stroke="#d4d6db" stroke-width="1"/>
<line x1="125.0" y1="150.0" x2="173.5" y2="178.0" stroke="#d4d6db" stroke-width="1"/>
<line x1="125.0" y1="150.0" x2="125.0" y2="206.0" stroke="#d4d6db" stroke-width="1"/>
<line x1="125.0" y1="150.0" x2="76.5" y2="178.0" stroke="#d4d6db" stroke-width="1"/>
<line x1="125.0" y1="150.0" x2="76.5" y2="122.0" stroke="#d4d6db" stroke-width="1"/>
<polygon points="125.0,131.5 130.1,147.1 127.7,151.5 125.0,178.6 121.7,151.9 120.8,147.6" fill="#2F7D5F" fill-opacity="0.35" stroke="#2F7D5F" stroke-width="1.6"/>
<text x="125.0" y="76.1" text-anchor="middle" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="125.0" dy="0">hERG blockade</tspan></text>
<text x="189.0" y="107.5" text-anchor="start" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="189.0" dy="0">CYP2D6</tspan><tspan x="189.0" dy="11">inhibition</tspan></text>
<text x="189.0" y="181.5" text-anchor="start" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="189.0" dy="0">CYP2D6</tspan><tspan x="189.0" dy="11">substrate</tspan></text>
<text x="125.0" y="223.9" text-anchor="middle" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="125.0" dy="0">CYP3A4 substrate</tspan></text>
<text x="61.0" y="181.5" text-anchor="end" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="61.0" dy="0">P-gp</tspan><tspan x="61.0" dy="11">substrate</tspan></text>
<text x="61.0" y="107.5" text-anchor="end" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="61.0" dy="0">CYP1A2</tspan><tspan x="61.0" dy="11">inhibition</tspan></text>
<text x="125.0" y="24" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#18181b">Rosuvastatin</text>
<text x="125.0" y="41" text-anchor="middle" font-size="11" fill="#52525b">no DICT concern</text>
<text x="125.0" y="263" text-anchor="middle" font-size="11" fill="#52525b">mean liability 0.19</text>
