<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 272" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rt rd">
<title id="rt">Predicted liability profiles for a safe and a cardiotoxic drug</title>
<desc id="rd">Two six-spoke radars with axes for hERG blockade, CYP2D6 inhibition, CYP2D6 substrate, CYP3A4 substrate, P-glycoprotein substrate and CYP1A2 inhibition. Risk points outward on a fixed zero to one scale. Rosuvastatin, with no DICT concern, draws a small green polygon, mean liability 0.19. Dronedarone, with most DICT concern, draws a large red polygon, mean liability 0.74.</desc>
<rect width="500" height="272" fill="#ffffff"/>
<polygon points="125.0,136.0 137.1,143.0 137.1,157.0 125.0,164.0 112.9,157.0 112.9,143.0" fill="none" stroke="#d4d6db" stroke-width="1"/>
<polygon points="125.0,122.0 149.2,136.0 149.2,164.0 125.0,178.0 100.8,164.0 100.8,136.0" fill="none" stroke="#d4d6db" stroke-width="1"/>
<polygon points="125.0,108.0 161.4,129.0 161.4,171.0 125.0,192.0 88.6,171.0 88.6,129.0" fill="none" stroke="#d4d6db" stroke-width="1"/>
<polygon points="125.0,94.0 173.5,122.0 173.5,178.0 125.0,206.0 76.5,178.0 76.5,122.0" fill="none" stroke="#d4d6db" stroke-width="1"/>
