<text x="439.0" y="181.5" text-anchor="start" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="439.0" dy="0">CYP2D6</tspan><tspan x="439.0" dy="11">substrate</tspan></text>
<text x="375.0" y="223.9" text-anchor="middle" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="375.0" dy="0">CYP3A4 substrate</tspan></text>
<text x="311.0" y="181.5" text-anchor="end" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="311.0" dy="0">P-gp</tspan><tspan x="311.0" dy="11">substrate</tspan></text>
<text x="311.0" y="107.5" text-anchor="end" font-size="12" dominant-baseline="middle" fill="#52525b"><tspan x="311.0" dy="0">CYP1A2</tspan><tspan x="311.0" dy="11">inhibition</tspan></text>
