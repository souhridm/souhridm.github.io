<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 504" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rt rd">
<title id="rt">Predicted liability profiles for a safe and a cardiotoxic drug</title>
<desc id="rd">Six-spoke radars, risk outward on a fixed zero to one scale. Rosuvastatin, with no DICT concern, draws a small green polygon with a mean liability of 0.19. Dronedarone, with most DICT concern, draws a large red polygon with a mean liability of 0.74, high on hERG blockade, CYP2D6 inhibition and P-glycoprotein.</desc>
